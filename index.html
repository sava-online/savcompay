<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прокси</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      color: #222;
    }
    h1 { font-size: 22px; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      border: none;
      cursor: pointer;
      padding: 16px 28px;
      border-radius: 10px;
      font-size: 18px;
      margin: 8px;
      transition: background 0.2s;
    }
    .link-btn {
      background: #0088cc;
      color: #fff;
      text-decoration: none;
    }
    .link-btn:hover { background: #0077b3; }
    .copy-btn {
      background: #444;
      color: #fff;
    }
    .copy-btn:hover { background: #222; }
    .copy-btn.copied { background: #2e9e4f; }
    p {
      margin-top: 24px;
      color: #555;
      font-size: 14px;
      word-break: break-all;
    }
    .url-box {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #333;
      word-break: break-all;
      user-select: all;
    }
  </style>
</head>
<body>
  <h1>Прокси для Telegram</h1>

  <a class="btn link-btn"
     href="https://t.me/proxy?server=fast.mishutkin.click&port=443&secret=7vdn6-5XCNrcmF1YrW4EVgZkcml2ZS5nb29nbGUuY29t">
    Открыть прокси
  </a>

  <button class="btn copy-btn" id="copyBtn" type="button">Скопировать ссылку</button>

  <p>Ссылка (можно выделить вручную):</p>
  <div class="url-box" id="urlBox">https://t.me/proxy?server=fast.mishutkin.click&port=443&secret=7vdn6-5XCNrcmF1YrW4EVgZkcml2ZS5nb29nbGUuY29t</div>

  <script>
    const url = "https://t.me/proxy?server=fast.mishutkin.click&port=443&secret=7vdn6-5XCNrcmF1YrW4EVgZkcml2ZS5nb29nbGUuY29t";
    const btn = document.getElementById("copyBtn");

    btn.addEventListener("click", async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
        } else {
          // Резервный способ для http/старых браузеров
          const ta = document.createElement("textarea");
          ta.value = url;
          ta.style.position = "fixed";
          ta.style.top = "-1000px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        btn.textContent = "Скопировано ✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Скопировать ссылку";
          btn.classList.remove("copied");
        }, 1800);
      } catch (e) {
        // Если совсем не получилось — выделяем текст для ручного копирования
        const range = document.createRange();
        range.selectNodeContents(document.getElementById("urlBox"));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = "Выделено — нажмите Ctrl+C";
      }
    });
  </script>
</body>
</html>
