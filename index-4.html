<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlassTube</title>
<style>
/* ============================================================
   GlassTube — Liquid Glass design system (glass.css)
   Calm, premium, glassy UI. Dark by default, light optional.
   ============================================================ */

:root {
  /* Dark theme (default) */
  --bg: #0a0c14;
  --bg-2: #0e1120;
  --text: #eef1f8;
  --muted: #9aa3b8;
  --accent: #7c8cff;
  --accent-2: #43c6ff;
  --glass-bg: rgba(255, 255, 255, 0.06);
  --glass-bg-strong: rgba(255, 255, 255, 0.10);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-blur: 18px;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --shadow-soft: 0 6px 22px rgba(0, 0, 0, 0.30);
  --danger: #ff6b81;
  --success: #46d39a;
  --warning: #ffce6b;
  --ring: rgba(124, 140, 255, 0.45);
  --maxw: 1200px;
}

[data-theme="light"] {
  --bg: #eef1f8;
  --bg-2: #e4e9f4;
  --text: #161a26;
  --muted: #5b6379;
  --accent: #5a6cff;
  --accent-2: #1f9fe0;
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.7);
  --glass-blur: 16px;
  --shadow: 0 10px 34px rgba(40, 50, 90, 0.18);
  --shadow-soft: 0 6px 18px rgba(40, 50, 90, 0.12);
  --danger: #d8455f;
  --success: #1faf76;
  --warning: #c79100;
  --ring: rgba(90, 108, 255, 0.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(124, 140, 255, 0.18), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(67, 198, 255, 0.14), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }

img { max-width: 100%; display: block; }

::selection { background: var(--ring); color: #fff; }

/* ---------- Glass surfaces ---------- */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  backdrop-filter: blur(var(--glass-blur)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);
  box-shadow: var(--shadow-soft);
}

.glass-strong {
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  backdrop-filter: blur(var(--glass-blur)) saturate(150%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
  box-shadow: var(--shadow);
}

/* ---------- Layout ---------- */
.container { max-width: var(--maxw); margin: 0 auto; padding: 0 18px; }
.page { padding: 28px 0 64px; }
.section { margin: 34px 0; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.section-title { font-size: 1.25rem; font-weight: 650; letter-spacing: .2px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- Top navigation ---------- */
.navbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px;
  margin: 12px auto;
  max-width: var(--maxw);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  backdrop-filter: blur(var(--glass-blur)) saturate(140%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);
  box-shadow: var(--shadow-soft);
}
.brand { font-weight: 750; font-size: 1.15rem; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
.brand .dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 16px var(--ring);
}
.nav-search { flex: 1; max-width: 520px; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-links a { padding: 8px 12px; border-radius: 12px; color: var(--muted); }
.nav-links a:hover { color: var(--text); background: var(--glass-bg); }

/* ---------- Forms ---------- */
input, textarea, select, button { font: inherit; color: inherit; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.input, textarea.input, select.input {
  width: 100%; padding: 12px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text);
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
[data-theme="light"] .input { background: rgba(255,255,255,0.6); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
textarea.input { resize: vertical; min-height: 110px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  color: var(--text);
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
  backdrop-filter: blur(8px);
}
.btn:hover { background: var(--glass-bg-strong); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent; color: #fff; font-weight: 600;
  box-shadow: 0 8px 24px var(--ring);
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--danger); border-color: rgba(255,107,129,.4); }
.btn-danger:hover { background: rgba(255,107,129,.12); }
.btn-sm { padding: 7px 12px; border-radius: 11px; font-size: .85rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* ---------- Cards / grid ---------- */
.grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}
.video-card {
  border-radius: var(--radius); overflow: hidden;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur)) saturate(140%);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.video-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent); }
.thumb {
  position: relative; aspect-ratio: 16/9; width: 100%;
  background: linear-gradient(135deg, #2a3155, #1a2238);
  overflow: hidden;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .duration {
  position: absolute; right: 8px; bottom: 8px;
  background: rgba(0,0,0,.6); color: #fff; font-size: .72rem;
  padding: 2px 7px; border-radius: 8px;
}
.video-card .meta { padding: 12px 14px; }
.video-card .title { font-weight: 600; font-size: .98rem; line-height: 1.35; }
.video-card .sub { color: var(--muted); font-size: .82rem; margin-top: 4px; }
.badge {
  display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 999px;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border); color: var(--muted);
}
.badge.accent { color: var(--accent); border-color: var(--ring); }

/* ---------- Avatar ---------- */
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--glass-border); object-fit: cover;
  background: var(--glass-bg-strong);
}
.avatar.lg { width: 84px; height: 84px; }

/* ---------- Flash messages ---------- */
.flash {
  position: fixed; left: 50%; top: 18px; transform: translateX(-50%);
  z-index: 100; min-width: 280px; max-width: 90vw;
  padding: 12px 16px; border-radius: 14px;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--shadow); animation: drop .25s ease;
}
.flash.success { border-color: var(--success); }
.flash.error { border-color: var(--danger); }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- Pills / chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; font-size: .82rem;
  background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--muted);
}
.chip:hover { color: var(--text); border-color: var(--accent); }
.chip.active { color: var(--text); border-color: var(--accent); background: var(--glass-bg-strong); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; padding: 18px;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: min(640px, 100%);
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  backdrop-filter: blur(var(--glass-blur)) saturate(150%);
  padding: 22px; animation: drop .2s ease;
}
.modal h3 { margin: 0 0 12px; }

/* ---------- Responsive ---------- */
@media (max-width: 720px) {
  .navbar { flex-wrap: wrap; }
  .nav-search { order: 3; flex-basis: 100%; max-width: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Misc ---------- */
.empty {
  text-align: center; padding: 48px 18px; color: var(--muted);
  border: 1px dashed var(--glass-border); border-radius: var(--radius);
}
.skeleton {
  background: linear-gradient(90deg, var(--glass-bg), var(--glass-bg-strong), var(--glass-bg));
  background-size: 200% 100%; border-radius: var(--radius-sm);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.breadcrumbs { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
.breadcrumbs a:hover { color: var(--accent); }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .n { font-size: 1.7rem; font-weight: 700; }
.kpi .l { color: var(--muted); font-size: .85rem; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
hr.sep { border: none; border-top: 1px solid var(--glass-border); margin: 18px 0; }
.code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .85rem; }

/* ============================================================
   GlassTube — App components (app.css)
   ============================================================ */

/* ---------- Watch page ---------- */
.watch-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px;
  align-items: start;
}
@media (max-width: 980px) { .watch-layout { grid-template-columns: 1fr; } }

.player-wrap {
  position: relative; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--glass-border);
  background: #000; box-shadow: var(--shadow);
}
.player-wrap video { width: 100%; display: block; background: #000; aspect-ratio: 16/9; }

.watch-title { font-size: 1.4rem; font-weight: 680; margin: 14px 0 6px; }
.watch-sub { color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .9rem; }

.action-bar {
  display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; align-items: center;
  padding: 10px 12px; border-radius: 16px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur));
}
.action-bar .btn.active { color: var(--accent); border-color: var(--ring); }

.description-box {
  margin-top: 12px; padding: 14px 16px; border-radius: 16px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  white-space: pre-wrap; max-height: 220px; overflow: hidden; position: relative;
}
.description-box.expanded { max-height: none; }

.side-card { padding: 14px 16px; margin-bottom: 16px; }
.tag-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* ---------- AI assistant ---------- */
.ai-panel {
  padding: 16px; border-radius: 18px; margin-top: 16px;
  background: linear-gradient(135deg, rgba(124,140,255,.14), rgba(67,198,255,.10));
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur));
}
.ai-panel h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.ai-result { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--glass-bg); border: 1px solid var(--glass-border); white-space: pre-wrap; }
.ai-loading { opacity: .6; font-style: italic; }
.ai-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- Comments ---------- */
.comment-form textarea { min-height: 84px; }
.comment {
  display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--glass-border);
}
.comment .body { flex: 1; }
.comment .body .name { font-weight: 600; font-size: .92rem; }
.comment .body .time { color: var(--muted); font-size: .78rem; }
.comment .body .text { margin-top: 4px; white-space: pre-wrap; }
.comment.hidden-comment { opacity: .55; font-style: italic; }

/* ---------- Tables (admin) ---------- */
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--glass-border); font-size: .9rem; }
.table th { color: var(--muted); font-weight: 600; }
.table tr:hover td { background: var(--glass-bg); }

/* ---------- Auth / centered forms ---------- */
.auth-wrap { max-width: 420px; margin: 40px auto; padding: 26px; }
.auth-wrap h1 { font-size: 1.4rem; margin: 0 0 6px; }

/* ---------- Channel header ---------- */
.channel-head { display: flex; gap: 18px; align-items: center; padding: 18px; margin-bottom: 18px; }
.channel-head .name { font-size: 1.4rem; font-weight: 700; }
.channel-head .desc { color: var(--muted); }

/* ---------- Range slider (quiet mode etc.) ---------- */
input[type="range"] { accent-color: var(--accent); }
.checkbox-row { display: flex; gap: 10px; align-items: flex-start; }
.checkbox-row input { margin-top: 4px; }

/* ---------- Utilities ---------- */
.text-center { text-align: center; }
.mt-0 { margin-top: 0; }
.mt-1 { margin-top: 8px; }
.mt-2 { margin-top: 16px; }
.mb-1 { margin-bottom: 8px; }
.flex { display: flex; }
.gap-1 { gap: 8px; }
.items-center { align-items: center; }
.text-sm { font-size: .85rem; }
.nowrap { white-space: nowrap; }

/* Quiet mode hides secondary blocks */
body.quiet .quiet-hide { display: none !important; }

.flash{position:fixed}
</style>
</head>
<body>
<header class="container" id="nav"></header>
<main class="container page" id="main"></main>
<footer class="container" style="padding:28px 0;color:var(--muted);font-size:.85rem">
  <div class="row"><span>GlassTube — спокойный видеохостинг.</span><span class="spacer"></span><a href="#/rules">Правила</a><a href="#/search">Поиск</a></div>
</footer>
<script>
'use strict';
/* GlassTube — standalone single-file edition.
   Backend (PHP/MySQL) is replaced by a browser store (localStorage + IndexedDB for video files). */

// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const now = () => Date.now();
const fmtNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + ' млн' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + ' тыс.' : String(n);
const fmtDur = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; const p = (n) => String(n).padStart(2, '0'); return h ? `${h}:${p(m)}:${p(x)}` : `${m}:${p(x)}`; };
const fmtDate = (t) => new Date(t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
const slugify = (s) => String(s).toLowerCase().trim().replace(/[^a-z0-9а-яё]+/gi, '-').replace(/^-+|-+$/g, '') || 'item';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn('storage', e); } },
};
const hash32 = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'h' + (h >>> 0).toString(16); };

// ---------------------------------------------------------------- IndexedDB (video blobs)
const idb = {
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('glasstube', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return this._db;
  },
  async put(k, blob) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').put(blob, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async del(k) { try { const db = await this.open(); db.transaction('files', 'readwrite').objectStore('files').delete(k); } catch (_) {} },
};

// ---------------------------------------------------------------- data
const CATS = [['education', 'Образование'], ['technology', 'Технологии'], ['music', 'Музыка'], ['film', 'Кино'], ['art', 'Искусство'], ['science', 'Наука'], ['lectures', 'Лекции'], ['reviews', 'Обзоры'], ['creativity', 'Творчество'], ['other', 'Другое']]
  .map(([slug, name], i) => ({ id: i + 1, slug, name }));
const catById = (id) => CATS.find((c) => c.id === Number(id));
const catBySlug = (s) => CATS.find((c) => c.slug === s);

let db;
function seed() {
  const t = now(), H = 3600e3;
  const d = {
    seq: 100,
    users: [
      { id: 1, username: 'admin', email: 'admin@glasstube.local', pass: hash32('admin1234'), role: 'admin', bio: 'Администратор GlassTube.', active: true, created: t - 30 * 24 * H },
      { id: 2, username: 'demo', email: 'demo@glasstube.local', pass: hash32('demo1234'), role: 'user', bio: 'Демонстрационный автор.', active: true, created: t - 20 * 24 * H },
    ],
    channels: [
      { id: 1, user_id: 1, name: 'GlassTube Official', slug: 'admin', description: 'Официальный канал платформы.' },
      { id: 2, user_id: 2, name: 'Demo Studio', slug: 'demo', description: 'Спокойные видео о дизайне, музыке и науке.' },
    ],
    videos: [], comments: [], reports: [], ai: [], subs: [], saved: [], history: [], playlists: [], likes: [],
    settings: { enable_ai: true, require_video_approval: false, video_max_mb: 1024, ai_daily_limit_auth: 100, registration_open: true },
  };
  const demos = [
    ['Как устроен спокойный интерфейс', 'Разбираем принципы Liquid Glass и тихого дизайна: прозрачность, размытие, мягкие тени и отсутствие агрессивных паттернов удержания внимания.', 'technology', ['дизайн', 'код'], 120, 540, 2],
    ['Лёгкая музыка для фокуса', 'Мягкий инструментальный сет для работы и отдыха.', 'music', ['музыка', 'калм'], 150, 312, 2],
    ['Введение в астрономию', 'Короткая лекция о планетах и звёздах. Поговорим о Солнечной системе, галактиках и о том, как устроены наблюдения.', 'science', ['обучение', 'природа'], 180, 861, 2],
    ['Рисуем утро на планшете', 'Расслабленный процесс цифровой живописи.', 'art', ['творчество', 'дизайн'], 210, 97, 2],
    ['Обзор спокойных приложений', 'Что помогает не отвлекаться в течение дня.', 'reviews', ['обучение'], 240, 455, 2],
    ['Добро пожаловать в GlassTube', 'Короткий тур по платформе: загрузка, плейлисты, подписки и ИИ-помощник.', 'education', ['обучение', 'калм'], 95, 1280, 1],
    ['Тихий лес: звуки природы', 'Записи леса на рассвете. Без музыки, только шорох листвы и птицы.', 'other', ['природа', 'калм'], 600, 233, 1],
  ];
  demos.forEach((v, i) => {
    d.videos.push({
      id: i + 1, user_id: v[6], channel_id: v[6], category_id: CATS.find((c) => c.slug === v[2]).id, title: v[0], description: v[1], tags: v[3],
      visibility: 'public', status: 'published', views: v[5], duration: v[4], created: t - i * 5 * H, hue: (i * 47 + 220) % 360, file: false,
    });
  });
  d.comments.push(
    { id: 1, video_id: 1, user_id: 1, body: 'Отличный разбор! Хочется больше таких видео.', status: 'visible', created: t - 3 * H },
    { id: 2, video_id: 1, user_id: 2, body: 'Спасибо, рад, что понравилось.', status: 'visible', created: t - 2 * H },

function aiAllowed() {

  if (!s.enable_ai) { toast('ИИ-помощник отключён администратором.', 'error'); return false; }
  const day = new Date().toDateString();
  const uid = me()?.id || 0;
  const used = db.ai.filter((a) => a.user_id === uid && new Date(a.ts).toDateString() === day).length;
  const limit = me() ? Number(s.ai_daily_limit_auth) : 10;
  if (used >= limit) { toast('Дневной лимит ИИ-запросов исчерпан.', 'error'); return false; }
  return true;
}
const aiLog = (task) => { db.ai.push({ id: nid(), user_id: me()?.id || 0, task, provider: 'mock', status: 'ok', ts: now() }); save(); };
const STOP = ['и', 'в', 'на', 'с', 'по', 'для', 'это', 'как', 'что', 'the', 'a', 'of', 'to', 'is', 'не', 'но', 'или', 'из', 'за', 'от', 'о', 'об', 'к'];
function aiSuggestTags(text) {
  const freq = {};
  text.toLowerCase().replace(/[^a-zа-яё0-9\s]/gi, ' ').split(/\s+/).filter((w) => w.length > 3 && !STOP.includes(w)).forEach((w) => { freq[w] = (freq[w] || 0) + 1; });
  return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 5).map((e) => e[0]);
}
function aiModerate(text) {
  const t = text.toLowerCase();
  return !['spam', 'http://', 'https://', 'купить', 'casino', 'xxx', 'сука', 'идиот'].some((w) => t.includes(w));
}

function vSearch(q) {
  const term = (q.get('q') || '').trim(), cat = q.get('category') || '', sort = q.get('sort') || 'relevance', useAi = q.get('ai') === '1';
  let results = [], explanation = '';
  if (term) {
    let tokens = term.toLowerCase().split(/\s+/).filter(Boolean);
    if (useAi && aiAllowed()) {
      aiLog('search');
      tokens = tokens.map((t) => (t.length > 5 ? t.slice(0, -2) : t));
      explanation = 'Ищем по смыслу: ' + tokens.join(', ') + ' (учтены словоформы).';
    }
    results = catalog().map((v) => {
      const ch = chanOf(v).name.toLowerCase();
      let s = 0;
      tokens.forEach((t) => { if (v.title.toLowerCase().includes(t)) s += 3; if (v.tags.some((g) => g.toLowerCase().includes(t))) s += 2; if (v.description.toLowerCase().includes(t)) s += 1; if (ch.includes(t)) s += 1; });
      return { v, s };

    results.sort((a, b) => sort === 'new' ? b.v.created - a.v.created : sort === 'popular' ? b.v.views - a.v.views : b.s - a.s || b.v.created - a.v.created);

        <label class="chip">Сортировка: <select class="input" name="sort" style="width:auto;display:inline-block;margin-left:6px" data-autosubmit>${[['relevance', 'По релевантности'], ['new', 'Новые'], ['popular', 'Популярные']].map(([k, n]) => `<option value="${k}" ${sort === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>

}

// ---------------------------------------------------------------- router
const AUTH_ROUTES = ['upload', 'settings', 'subscriptions', 'history'];
function render() {
  if (!db) return;
  const { parts, q } = parseHash(); const r = parts[0] || '', a = parts[1];
  let res;
  if (AUTH_ROUTES.includes(r) && !me()) { toast('Войдите, чтобы продолжить.', 'error'); return go('/login'); }
  if (r === 'admin' && !isAdmin()) res = v404();
  else if ((r === 'login' || r === 'register') && me()) return go('/');
  else if (r === 'video' && parts[2] === 'edit') res = me() ? vVideoEdit(a) : (go('/login'), null);
  else switch (r) {
    case '': res = vHome(q); break;
    case 'search': res = vSearch(q); break;
    case 'category': res = vCategory(a); break;
    case 'tag': res = vTag(decodeURIComponent(a || '')); break;
    case 'channel': res = vChannel(a); break;
    case 'watch': res = vWatch(a); break;
    case 'login': res = vAuth('login'); break;
    case 'register': res = vAuth('register'); break;
    case 'upload': res = vUpload(); break;
    case 'settings': res = vSettings(); break;
    case 'playlist': res = vPlaylist(a); break;
    case 'subscriptions': res = vSubs(); break;
    case 'history': res = vHistory(); break;
    case 'rules': res = vRules(); break;
    case 'admin': res = vAdmin(a); break;
    default: res = v404();
  }
  if (!res) return;
  $('#nav').innerHTML = navHtml();
  $('#main').innerHTML = res.html;
  document.title = res.title;
  window.scrollTo(0, 0);
  if (res.after === 'watch') afterWatch(res.videoId);
}

async function afterWatch(id) {
  const v = videoById(id), u = me();
  const key = 'gt-viewed-' + id;
  try { if (!sessionStorage.getItem(key)) { sessionStorage.setItem(key, '1'); v.views++; save(); } } catch (_) {}
  let hist = null;
  if (u) {
    hist = db.history.find((h) => h.user_id === u.id && h.video_id === id);
    if (!hist) { hist = { user_id: u.id, video_id: id, ts: now(), progress: 0, duration: v.duration }; db.history.push(hist); }
    hist.ts = now(); save();
  }
  if (!v.file) return;
  const el = $('#gt-player'); if (!el) return;
  try {
    const blob = await idb.get('v' + id);
    if (!blob) { el.insertAdjacentHTML('afterend', '<div class="muted text-sm" style="padding:12px">Файл видео не найден в хранилище браузера.</div>'); return; }
    el.src = URL.createObjectURL(blob);
    el.addEventListener('loadedmetadata', () => { if (hist && hist.progress > 5 && hist.progress < el.duration - 5) el.currentTime = hist.progress; });
    let last = 0;
    el.addEventListener('timeupdate', () => { if (hist && el.currentTime - last > 3) { last = el.currentTime; hist.progress = Math.floor(el.currentTime); hist.duration = Math.floor(el.duration || 0); hist.ts = now(); save(); } });
  } catch (e) { console.warn(e); }
}

// ---------------------------------------------------------------- actions
const need = () => { if (!me()) { go('/login'); return false; } return true; };
function readVideoMeta(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file), v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true; v.src = url;
    const done = (o) => { URL.revokeObjectURL(url); res(o); };
    v.onloadedmetadata = () => { const dur = v.duration; v.currentTime = Math.min(1, dur / 2 || 0); v.onseeked = () => { try { const c = document.createElement('canvas'); c.width = 480; c.height = Math.round(480 * (v.videoHeight || 9) / (v.videoWidth || 16)); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); done({ duration: Math.round(dur), thumb: c.toDataURL('image/jpeg', .7) }); } catch (_) { done({ duration: Math.round(dur) }); } }; };
    v.onerror = () => done({ duration: 0 });
    setTimeout(() => done({ duration: 0 }), 8000);
  });
}
const parseTags = (s) => [...new Set(String(s || '').split(',').map((t) => t.trim()).filter(Boolean))].slice(0, 10);

const clickActions = {
  theme() { const n = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', n); store.set('gt-theme', n); $('#nav').innerHTML = navHtml(); },
  logout() { meId = null; store.set('gt-session', null); go('/'); toast('Вы вышли.'); },
  quiet() { document.body.classList.toggle('quiet'); store.set('gt-quiet', document.body.classList.contains('quiet')); },
  'desc-toggle'(b) { const e = $('#desc-box').classList.toggle('expanded'); b.textContent = e ? 'Свернуть' : 'Показать полностью'; },
  like(b) { if (!need()) return; const id = +b.dataset.id, i = db.likes.findIndex((l) => l.user_id === meId && l.video_id === id); i >= 0 ? db.likes.splice(i, 1) : db.likes.push({ user_id: meId, video_id: id }); save(); b.classList.toggle('active', i < 0); b.innerHTML = (i < 0 ? '❤️ ' : '🤍 ') + '<span>' + fmtNum(likeCount(id)) + '</span>'; },
  save(b) { if (!need()) return; const id = +b.dataset.id, i = db.saved.findIndex((l) => l.user_id === meId && l.video_id === id); i >= 0 ? db.saved.splice(i, 1) : db.saved.push({ user_id: meId, video_id: id }); save(); b.classList.toggle('active', i < 0); b.textContent = i < 0 ? '🔖 Сохранено' : '🔖 Сохранить'; },
  subscribe(b) { if (!need()) return; const id = +b.dataset.id, i = db.subs.findIndex((l) => l.user_id === meId && l.channel_id === id); i >= 0 ? db.subs.splice(i, 1) : db.subs.push({ user_id: meId, channel_id: id }); save(); b.classList.toggle('active', i < 0); b.textContent = i < 0 ? '✓ Вы подписаны' : '＋ Подписаться'; },
  'report-open'(b) { const m = $('#report-modal'); m.querySelector('[name=target_type]').value = b.dataset.type; m.querySelector('[name=target_id]').value = b.dataset.id; m.classList.add('open'); },
  'report-close'() { $('#report-modal').classList.remove('open'); },
  'delete-comment'(b) { if (!confirm('Удалить комментарий?')) return; db.comments = db.comments.filter((c) => c.id !== +b.dataset.id); save(); render(); },
  'ai-summarize'(b) {
    if (!aiAllowed()) return; const v = videoById(b.dataset.id), out = $('#ai-result');
    out.innerHTML = '<div class="ai-loading">ИИ-помощник думает…</div>'; aiLog('summarize');
    setTimeout(() => {
      const topics = v.tags.length ? v.tags : aiSuggestTags(v.title + ' ' + v.description), step = Math.max(10, Math.floor((v.duration || 90) / 3));
      out.innerHTML = `<div class="ai-result"><strong>Краткое описание</strong><br>${esc(`Обзор видео «${v.title}». ` + (v.description ? v.description.slice(0, 200) : 'Описание отсутствует.'))}</div>
        <div class="ai-result mt-1"><strong>Темы:</strong> ${topics.map(esc).join(', ')}</div>
        <div class="ai-result mt-1"><strong>Главы:</strong><ul style="margin:6px 0 0 18px">${['Вступление', 'Основная часть', 'Заключение'].map((t, i) => `<li>${fmtDur(i * step)} — ${t}</li>`).join('')}</ul></div>
        <div class="ai-result mt-1 muted">⚠️ Демо-режим: используется mock-провайдер без внешнего ИИ.</div>`;
    }, 450);
  },
  'ai-similar'(b) { if (!aiAllowed()) return; aiLog('search'); go('/search?q=' + encodeURIComponent(videoById(b.dataset.id).title) + '&ai=1'); },
  'ai-meta'() {
    if (!aiAllowed()) return; aiLog('metadata');
    const t = $('#u-title'), d = $('#u-desc'), g = $('#u-tags'), title = t.value.trim();
    if (title) t.value = title.charAt(0).toUpperCase() + title.slice(1).toLowerCase();
    const tags = parseTags(g.value); if (!tags.length) g.value = aiSuggestTags(title + ' ' + d.value).join(', ');
    $('#ai-meta-result').innerHTML = '<div class="ai-result">✨ Метаданные обновлены (mock-провайдер).</div>';
  },
  'ai-tags'() {
    if (!aiAllowed()) return; aiLog('suggest_tags');
    const sug = aiSuggestTags($('#u-title').value + ' ' + $('#u-desc').value), g = $('#u-tags');
    g.value = [...new Set([...parseTags(g.value), ...sug])].slice(0, 10).join(', ');
    $('#ai-meta-result').innerHTML = `<div class="ai-result">🏷️ ${sug.length ? 'Добавлены теги: ' + esc(sug.join(', ')) : 'Не из чего предлагать — заполните название и описание.'}</div>`;
  },
  'video-delete'(b) { if (!confirm('Удалить видео безвозвратно?')) return; const id = +b.dataset.id; db.videos = db.videos.filter((v) => v.id !== id); db.comments = db.comments.filter((c) => c.video_id !== id); idb.del('v' + id); save(); toast('Видео удалено.'); go('/'); },
  'history-clear'() { db.history = db.history.filter((h) => h.user_id !== meId); save(); render(); },
  'pl-delete'(b) { if (!confirm('Удалить плейлист?')) return; db.playlists = db.playlists.filter((p) => p.id !== +b.dataset.id); save(); go('/settings'); },
  'pl-remove'(b) { const p = db.playlists.find((x) => x.id === +b.dataset.id); p.items = p.items.filter((i) => i !== +b.dataset.video); save(); render(); },
  'u-active'(b) { const u = userById(+b.dataset.id); u.active = !u.active; save(); render(); },
  'u-admin'(b) { const u = userById(+b.dataset.id); u.role = u.role === 'admin' ? 'user' : 'admin'; save(); render(); },
  'v-publish'(b) { videoById(b.dataset.id).status = 'published'; save(); render(); },
  'v-block'(b) { videoById(b.dataset.id).status = 'blocked'; save(); render(); },
  'v-del'(b) { if (!confirm('Удалить видео?')) return; const id = +b.dataset.id; db.videos = db.videos.filter((v) => v.id !== id); idb.del('v' + id); save(); render(); },
  'c-hide'(b) { db.comments.find((c) => c.id === +b.dataset.id).status = 'hidden'; save(); render(); },
  'c-restore'(b) { db.comments.find((c) => c.id === +b.dataset.id).status = 'visible'; save(); render(); },
  'c-del'(b) { db.comments = db.comments.filter((c) => c.id !== +b.dataset.id); save(); render(); },
  'r-resolve'(b) { db.reports.find((r) => r.id === +b.dataset.id).status = 'resolved'; save(); render(); },
  'r-dismiss'(b) { db.reports.find((r) => r.id === +b.dataset.id).status = 'dismissed'; save(); render(); },
  async 'reset-all'() { if (!confirm('Удалить все данные, включая загруженные видео?')) return; localStorage.removeItem('gt-db'); localStorage.removeItem('gt-session'); try { indexedDB.deleteDatabase('glasstube'); } catch (_) {} idb._db = null; meId = null; load(); go('/'); },
};

const formActions = {
  navsearch(f) { go('/search?q=' + encodeURIComponent(f.q.value.trim())); },
  search(f) { const p = new URLSearchParams(); if (f.q.value.trim()) p.set('q', f.q.value.trim()); if (f.category.value) p.set('category', f.category.value); if (f.sort.value !== 'relevance') p.set('sort', f.sort.value); if (f.ai.checked) p.set('ai', '1'); go('/search?' + p); },
  login(f) {
    const l = f.login.value.trim().toLowerCase(), u = db.users.find((x) => x.username.toLowerCase() === l || x.email.toLowerCase() === l);
    if (!u || u.pass !== hash32(f.password.value)) return toast('Неверный логин или пароль.', 'error');
    if (!u.active) return toast('Аккаунт отключён.', 'error');
    meId = u.id; store.set('gt-session', meId); toast('С возвращением, ' + u.username + '!'); go('/');
  },
  register(f) {
    const un = f.username.value.trim(), em = f.email.value.trim();
    if (!/^[A-Za-z0-9_]{3,30}$/.test(un)) return toast('Логин: 3–30 символов, латиница, цифры, _.', 'error');
    if (db.users.some((x) => x.username.toLowerCase() === un.toLowerCase() || x.email.toLowerCase() === em.toLowerCase())) return toast('Логин или email уже заняты.', 'error');
    const u = { id: nid(), username: un, email: em, pass: hash32(f.password.value), role: 'user', bio: '', active: true, created: now() };
    db.users.push(u); db.channels.push({ id: nid(), user_id: u.id, name: un, slug: un.toLowerCase(), description: '' });
    save(); meId = u.id; store.set('gt-session', meId); toast('Аккаунт создан. Добро пожаловать!'); go('/');
  },
  comment(f) {
    const body = f.body.value.trim(); if (!body) return;
    const ok = !db.settings.enable_ai || aiModerate(body);
    if (db.settings.enable_ai) { if (aiAllowed()) aiLog('moderate'); }
    db.comments.push({ id: nid(), video_id: +f.dataset.id, user_id: meId, body, status: ok ? 'visible' : 'hidden', created: now() }); save();
    toast(ok ? 'Комментарий добавлен.' : 'Комментарий скрыт ИИ-модерацией: похоже на спам.', ok ? 'success' : 'error'); render();
  },
  report(f) {
    db.reports.push({ id: nid(), user_id: meId, target_type: f.target_type.value, target_id: +f.target_id.value, reason: f.reason.value, details: f.details.value.trim(), status: 'open', ts: now() }); save();
    $('#report-modal').classList.remove('open'); f.reset(); toast('Жалоба отправлена. Спасибо!');
  },
  settings(f) {
    const u = me(), ch = chanByUser(u.id); u.bio = f.bio.value.trim(); ch.name = f.channel_name.value.trim(); ch.description = f.channel_description.value.trim();
    if (f.new_password.value) { if (u.pass !== hash32(f.current_password.value)) return toast('Текущий пароль неверный.', 'error'); u.pass = hash32(f.new_password.value); }
    save(); toast('Настройки сохранены.'); render();
  },
  plcreate(f) { db.playlists.push({ id: nid(), user_id: meId, name: f.name.value.trim(), visibility: f.visibility.value, items: [] }); save(); toast('Плейлист создан.'); render(); },
  videoedit(f) {
    const v = videoById(f.dataset.id); v.title = f.title.value.trim(); v.description = f.description.value.trim(); v.category_id = f.category_id.value ? +f.category_id.value : null; v.tags = parseTags(f.tags.value); v.visibility = f.visibility.value;
    save(); toast('Видео обновлено.'); go('/watch/' + v.id);
  },
  adminsettings(f) {
    Object.assign(db.settings, { enable_ai: f.enable_ai.checked, require_video_approval: f.require_video_approval.checked, registration_open: f.registration_open.checked, video_max_mb: Math.max(1, +f.video_max_mb.value || 1024), ai_daily_limit_auth: Math.max(0, +f.ai_daily_limit_auth.value || 0) });
    save(); toast('Настройки сохранены.');
  },
  async upload(f) {
    const err = $('#upload-error'), btn = f.querySelector('button[type=submit]'); err.textContent = '';
    const file = f.file.files[0]; if (!file) { err.textContent = 'Выберите видеофайл.'; return; }
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['mp4', 'webm'].includes(ext)) { err.textContent = 'Недопустимое расширение. Разрешены: mp4, webm.'; return; }
    if (file.size > db.settings.video_max_mb * 1048576) { err.textContent = `Файл слишком большой (максимум ${db.settings.video_max_mb} МБ).`; return; }
    btn.disabled = true; btn.textContent = 'Обработка…';
    try {
      const meta = await readVideoMeta(file), id = nid();
      await idb.put('v' + id, file);
      const needReview = db.settings.require_video_approval;
      db.videos.push({ id, user_id: meId, channel_id: chanByUser(meId).id, category_id: f.category_id.value ? +f.category_id.value : null, title: f.title.value.trim(), description: f.description.value.trim(), tags: parseTags(f.tags.value), visibility: f.visibility.value, status: needReview ? 'pending_review' : 'published', views: 0, duration: meta.duration, thumb: meta.thumb, created: now(), hue: Math.floor(Math.random() * 360), file: true });
      save(); toast(needReview ? 'Видео отправлено на проверку.' : 'Видео загружено!'); go('/watch/' + id);
    } catch (e) { console.error(e); err.textContent = 'Не удалось сохранить видео в браузере (возможно, мало места).'; btn.disabled = false; btn.textContent = 'Загрузить видео'; }
  },
};

document.addEventListener('click', (e) => {
  const m = e.target.closest('#report-modal'); if (m && e.target === m) m.classList.remove('open');
  const b = e.target.closest('[data-action]'); if (!b) return;
  const fn = clickActions[b.dataset.action]; if (fn) { e.preventDefault(); fn(b); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); const fn = formActions[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-autosubmit]')) t.form.requestSubmit();
  if (t.matches('[data-action-change="addpl"]') && t.value) {
    const p = db.playlists.find((x) => x.id === +t.value), id = +t.dataset.id;
    if (!p.items.includes(id)) p.items.push(id); save(); toast('Добавлено в «' + p.name + '».'); t.value = '';
  }
});
window.addEventListener('hashchange', render);

// ---------------------------------------------------------------- boot
(function boot() {
  const th = store.get('gt-theme', null); if (th) document.documentElement.setAttribute('data-theme', th);
  if (store.get('gt-quiet', false)) document.body.classList.add('quiet');
  load();
  render();
})();

</script>
</body>
</html>
