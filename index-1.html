  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, updateProfile, signOut, sendEmailVerification,
  sendPasswordResetEmail, reload
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getDatabase, ref, set, get, push, onValue, query, orderByChild, equalTo,
  runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC9rKXKdnooeJlN8e8_ydbakgEs8ybs60o",
  authDomain: "savcompay.firebaseapp.com",
  databaseURL: "https://savcompay-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "savcompay",
  storageBucket: "savcompay.firebasestorage.app",
  messagingSenderId: "323188285385",
  appId: "1:323188285385:web:d5c2e68347a660cf7a1218",
  measurementId: "G-FFEXJW14NW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

let authMode = "login";
let currentUser = null;
let currentProfile = null;
let chatUnsub = null;
let balance = 0; // Не показываем выдуманные средства: реальные балансы требуют отдельной интеграции.

function esc(s=""){
  s=String(s ?? "");
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function money(n){ return Number(n).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

function randomSavcomId(){ return String(Math.floor(10000000 + Math.random()*90000000)); }

async function reserveSavcomId(uid){
  for(let i=0;i<8;i++){
    const id=randomSavcomId();
    const result=await runTransaction(ref(db, `savcomIds/${id}`), cur => cur ?? uid);
    if(result.committed && result.snapshot.val() === uid) return id;
  }
  throw new Error("Не удалось создать уникальный SavcomPay ID.");
}

async function createProfile(user, displayName){
  const existing=await get(ref(db, `users/${user.uid}`));
  if(existing.exists()) return existing.val();

  const savcomId=await reserveSavcomId(user.uid);
  const profile={
    uid:user.uid,
    savcomId,
    displayName:displayName || user.email?.split("@")[0] || "Пользователь",
    email:user.email || "",
    createdAt:serverTimestamp()
  };
  await set(ref(db, `users/${user.uid}`), profile);
  return profile;
}

async function loadProfile(user){
  const snap=await get(ref(db, `users/${user.uid}`));
  if(snap.exists()) return snap.val();
  return createProfile(user, user.displayName);
}

function setAuthMode(mode){
  authMode=mode;
  $$(".auth-tab").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  $("#nameField").style.display=mode==="register"?"block":"none";
  $("#authSubmit").textContent=mode==="register"?"Создать аккаунт":"Войти";
  $("#authError").textContent="";
}

async function handleAuth(e){
  e.preventDefault();
  const email=$("#emailInput").value.trim();
  const password=$("#passwordInput").value;
  const name=$("#nameInput").value.trim();
  $("#authError").textContent="";
  try{
    if(authMode==="register"){
      if(name.length < 2) throw new Error("Введите имя (минимум 2 символа).");
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      if(name) await updateProfile(cred.user,{displayName:name});
      await sendEmailVerification(cred.user);
      $("#authError").textContent="Аккаунт создан. Откройте письмо от Firebase и подтвердите email, затем нажмите «Я подтвердил email».";
      $("#resendVerificationBtn").classList.remove("hidden");
      $("#confirmedEmailBtn").classList.remove("hidden");
    }else{
      const cred=await signInWithEmailAndPassword(auth,email,password);
      if(!cred.user.emailVerified){
        $("#authError").textContent="Сначала подтвердите email по ссылке в письме. Если письма нет, нажмите «Отправить письмо подтверждения».";
        $("#resendVerificationBtn").classList.remove("hidden");
        $("#confirmedEmailBtn").classList.remove("hidden");
      }
    }
  }catch(err){
    $("#authError").textContent=humanFirebaseError(err);
  }
}

function humanFirebaseError(err){
  const code=err?.code || "";
  const map={
    "auth/email-already-in-use":"Этот email уже зарегистрирован.",
    "auth/invalid-email":"Некорректный email.",
    "auth/weak-password":"Пароль должен быть не короче 6 символов.",
    "auth/invalid-credential":"Неверный email или пароль.",
    "auth/invalid-login-credentials":"Неверный email или пароль.",
    "auth/network-request-failed":"Проблема с сетью.",
    "auth/too-many-requests":"Слишком много попыток. Подождите и попробуйте позже.",
    "auth/operation-not-allowed":"Этот способ входа не включён в Firebase Console."
  };
  return map[code] || err?.message || "Произошла ошибка.";
}

function showSteam(){
  openModal("Пополнение Steam",`
    <div class="steam-hero"><small>SAVCOMPAY GAMING</small><h3>Steam</h3><p>Подготовка заказа через API поставщика.</p><div class="status-pill">Поставщик не подключён</div></div>
    <div class="notice-box">Это не настоящее пополнение: серверный API поставщика пока отсутствует. Деньги не списываются и заказ не создаётся, пока backend не будет настроен.</div>
    <label class="field"><span>Логин Steam или идентификатор</span><input id="steamAccount" maxlength="100" autocomplete="off" placeholder="Введите логин Steam"></label>
    <label class="field"><span>Сумма</span><input id="steamAmount" type="number" min="1" max="100000" step="1" placeholder="Например, 500"></label>
    <label class="field"><span>Регион / валюта</span><select id="steamCurrency" class="field-input" style="width:100%"><option value="">Сначала выберите поставщика</option></select></label>
    <button class="primary-btn" id="steamOrderBtn">Проверить подключение</button>
    <div class="modal-note" style="margin-top:12px">Поддерживаемые страны, валюты, суммы и итоговая комиссия должны загружаться с API выбранного поставщика, а не задаваться наугад в браузере.</div>
  `,()=>{
    $("#steamOrderBtn").onclick=async()=>{
      const account=$("#steamAccount").value.trim();
      const amount=Number($("#steamAmount").value);
      if(!account) return toast("Введите логин Steam");
      if(!Number.isFinite(amount)||amount<1||amount>100000) return toast("Проверьте сумму");
      if(!auth.currentUser) return toast("Сначала войдите в аккаунт");
      try{
        const response=await fetch("/api/steam/catalog",{headers:{"Authorization":"Bearer "+await auth.currentUser.getIdToken()}});
        if(!response.ok) throw new Error("API поставщика не настроен на сервере.");
        const data=await response.json();
        const select=$("#steamCurrency");
        select.innerHTML="<option value=''>Выберите доступный вариант</option>";
        (Array.isArray(data.items)?data.items:[]).forEach(item=>{
          if(!item || typeof item.id!=="string" || typeof item.name!=="string") return;
          const option=document.createElement("option"); option.value=item.id; option.textContent=item.name; select.appendChild(option);
        });
        toast("Каталог загружен. Выберите вариант и повторите проверку.");
        $("#steamOrderBtn").textContent="Создать заказ";
        $("#steamOrderBtn").onclick=()=>createSteamOrder(account,amount,select.value);
      }catch(err){
        console.error("Steam catalog:",err);
        toast(err.message||"Не удалось подключиться к API Steam.");
      }
    };
  });
}

async function createSteamOrder(account,amount,productId){
  if(!productId) return toast("Выберите вариант пополнения из каталога");
  if(!confirm(`Создать заказ на пополнение Steam?\nАккаунт: ${account}\nСумма: ${amount}\nПроверьте регион аккаунта. Оплата будет возможна только после ответа сервера.`)) return;
  try{
    const response=await fetch("/api/steam/orders",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+await auth.currentUser.getIdToken()},
      body:JSON.stringify({account,amount,productId})
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(result.error||"Сервер не смог создать заказ.");
    if(!result.orderId) throw new Error("Сервер не вернул номер заказа.");
    toast("Заказ создан: "+String(result.orderId));
    closeModal();
  }catch(err){console.error("Steam order:",err);toast(err.message||"Ошибка создания заказа");}
}

async function findUserById(id){
  const snap=await get(query(ref(db,"users"),orderByChild("savcomId"),equalTo(id)));
  let found=null;
  snap.forEach(c=>found=c.val());
  return found;
}

function showTransfer(){
  openModal("Перевод по SavcomPay ID",`
    <div class="modal-note">Введите уникальный ID получателя. В этой версии перевод меняет только локальный демо-баланс.</div>
    <label class="field"><span>Савком ID получателя</span><input id="receiverId" inputmode="numeric" placeholder="Например, 58392017"></label>
    <label class="field"><span>Сумма, ₽</span><input id="transferAmount" type="number" min="0.01" step="0.01" placeholder="500"></label>
    <label class="field"><span>Сообщение (необязательно)</span><input id="transferMessage" maxlength="140" placeholder="Спасибо!"></label>
    <div class="modal-actions"><button class="primary-btn" id="transferBtn">Продолжить</button></div>
  `,()=>{
    $("#transferBtn").onclick=async()=>{
      const id=$("#receiverId").value.trim();
      const amount=Number($("#transferAmount").value);
      const message=$("#transferMessage").value.trim();
      if(!/^\d{8}$/.test(id)) return toast("ID должен состоять из 8 цифр");
      if(!amount || amount<=0) return toast("Введите сумму");
      if(amount>balance) return toast("Недостаточно средств");
      if(id===currentProfile.savcomId) return toast("Нельзя отправить самому себе");
      try{
        const receiver=await findUserById(id);
        if(!receiver) return toast("Пользователь не найден");
        balance-=amount; updateUI(); closeModal();
        toast(`Демо-перевод ${money(amount)} ₽ пользователю ${receiver.displayName}`);
        await addHistory({
          type:"out",
          amount,
          title:`Перевод ${receiver.displayName}`,
          note:message || `ID ${id}`
        });
      }catch(err){ toast("Ошибка поиска пользователя"); }
    };
  });
}

async function addHistory(item){
  if(!currentUser) return;
  await push(ref(db,`history/${currentUser.uid}`),{
    ...item, createdAt:serverTimestamp()
  }).catch(()=>{});
}

async function showHistory(){
  if(!currentUser) return;
  const snap=await get(ref(db,`history/${currentUser.uid}`));
  const rows=[];
  snap.forEach(c=>rows.push(c.val()));
  rows.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  openModal("История", rows.length ? rows.map(x=>`
    <div class="history-row">
      <div class="history-dot">${x.type==="out"?"↑":"↓"}</div>
      <div class="history-meta"><b>${esc(x.title||"Операция")}</b><small>${esc(x.note||"")}</small></div>
      <div class="${x.type==="out"?"amount-minus":"amount-plus"}">${x.type==="out"?"−":"+"}${money(x.amount)} ₽</div>
    </div>`).join("") : `<div class="modal-note">История пока пустая.</div>`);
}

function showChat(){
  openModal("Чат",`

      <input class="field-input" id="chatId" placeholder="SavcomPay ID собеседника" inputmode="numeric">

    </div>
    <div id="chatArea" style="margin-top:14px"></div>
  `,()=>{
    $("#openChat").onclick=()=>openChat($("#chatId").value.trim());
  });
}

async function openChat(otherId){
  if(!/^\d{8}$/.test(otherId)) return toast("Введите 8-значный ID");
  const other=await findUserById(otherId);
  if(!other) return toast("Пользователь не найден");
  if(chatUnsub) chatUnsub();
  const ids=[currentProfile.savcomId,otherId].sort();
  const chatId=ids.join("_");
  const area=$("#chatArea");
  area.innerHTML=`
    <div class="modal-note">Чат с <b>${esc(other.displayName)}</b> · ID ${esc(otherId)}</div>
    <div class="chat-messages" id="chatMessages" style="margin-top:10px"></div>
    <div class="chat-compose"><input id="chatText" maxlength="500" placeholder="Написать сообщение..."><button class="primary-btn" id="sendChat" style="width:auto;padding:0 18px">➤</button></div>`;
  const messagesRef=ref(db,`chats/${chatId}/messages`);
  chatUnsub=onValue(messagesRef,snap=>{
    const msgs=[]; snap.forEach(c=>msgs.push(c.val()));
    msgs.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    $("#chatMessages").innerHTML=msgs.map(m=>`<div class="msg ${m.senderId===currentProfile.savcomId?"mine":""}">${esc(m.text)}</div>`).join("");
    const box=$("#chatMessages"); box.scrollTop=box.scrollHeight;
  });
  $("#sendChat").onclick=async()=>{
    const input=$("#chatText"), text=input.value.trim();
    if(!text) return;
    await push(messagesRef,{senderId:currentProfile.savcomId,text,createdAt:serverTimestamp()});
    input.value="";
  };
}

function action(name){
  if(name==="topup") return showTopup();
  if(name==="transfer") return showTransfer();
  if(name==="chat") return showChat();
  if(name==="history") return showHistory();
  if(name==="qr") return showQr();
  if(name==="cards") return showWallets();
  if(name==="steam") return showSteam();
}

$("#forgotPasswordBtn").onclick=async()=>{
  const email=$("#emailInput").value.trim();
  if(!email) { $("#authError").textContent="Сначала введите email в поле выше."; return; }
  try{ await sendPasswordResetEmail(auth,email); $("#authError").textContent="Если адрес зарегистрирован, Firebase отправит письмо для сброса пароля."; }
  catch(err){ $("#authError").textContent=humanFirebaseError(err); }
};
$("#resendVerificationBtn").onclick=async()=>{
  try{
    if(!auth.currentUser) { $("#authError").textContent="Войдите с этим email и паролем, чтобы отправить письмо повторно."; return; }
    await sendEmailVerification(auth.currentUser);
    $("#authError").textContent="Письмо подтверждения отправлено повторно. Проверьте папку «Спам».";
  }catch(err){ $("#authError").textContent=humanFirebaseError(err); }
};
$("#confirmedEmailBtn").onclick=async()=>{
  try{
    if(!auth.currentUser) { $("#authError").textContent="Сначала войдите в аккаунт."; return; }
    await reload(auth.currentUser);
    if(!auth.currentUser.emailVerified){ $("#authError").textContent="Firebase пока не видит подтверждение. Откройте ссылку в письме, затем попробуйте снова."; return; }
    currentProfile=await loadProfile(auth.currentUser);
    $("#authError").textContent="";
    $("#resendVerificationBtn").classList.add("hidden"); $("#confirmedEmailBtn").classList.add("hidden");
    $("#authScreen").classList.add("hidden"); $("#app").classList.remove("hidden"); updateUI();
  }catch(err){ $("#authError").textContent=humanFirebaseError(err); }
};
$("#topupBtn").onclick=showTopup;
$("#showIdBtn").onclick=showId;
$("#profileBtn").onclick=showProfile;
$$ ("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action));
$(".nav-item:first-child").onclick=()=>{ closeModal(); window.scrollTo({top:0,behavior:"smooth"}); };
$("#notificationsBtn").onclick=()=>openModal("Уведомления",`<div class="modal-note">Пока уведомлений нет. Система уведомлений появится после подключения событий и серверной логики.</div>`);
$("#globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.trim();if(q)toast("Поиск пользователей будет доступен после подключения поиска на сервере.");}});
$("#allActionsBtn").onclick=()=>toast("Все функции уже показаны на главной");

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    if(!user.emailVerified){
      $("#app").classList.add("hidden");
      $("#authScreen").classList.remove("hidden");
      $("#authError").textContent="Подтвердите email по ссылке в письме, чтобы открыть SavcomPay.";
      $("#resendVerificationBtn").classList.remove("hidden");
      $("#confirmedEmailBtn").classList.remove("hidden");
      return;
    }
    try{
      currentProfile=await loadProfile(user);
      $("#authScreen").classList.add("hidden");
      $("#app").classList.remove("hidden");
      $("#resendVerificationBtn").classList.add("hidden");
      $("#confirmedEmailBtn").classList.add("hidden");
      updateUI();
    }catch(e){
      $("#authError").textContent=humanFirebaseError(e);
    }
  }else{
    if(chatUnsub) { chatUnsub(); chatUnsub=null; }
    currentProfile=null;
    $("#app").classList.add("hidden");
    $("#authScreen").classList.remove("hidden");
  }
});
